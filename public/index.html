<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Mesh</title>
  <style>
    :root {
      --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
      --text: #e8e8e8; --text2: #a0a0b0; --accent: #00d4aa; --accent2: #00b894;
      --red: #ff6b6b; --green: #51cf66; --blue: #339af0;
      --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; background: transparent; }

    /* ═══ Message Bar (floating) ═══ */
    .msg-bar {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      display: flex; align-items: center; gap: 8px;
    }
    .msg-bar-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow); transition: all 0.2s;
      color: #fff; font-size: 24px;
    }
    .msg-bar-btn:hover { transform: scale(1.1); background: var(--accent2); }
    .msg-bar-input {
      width: 300px; padding: 12px 16px; border-radius: 28px;
      background: var(--bg); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); font-size: 14px; outline: none;
      box-shadow: var(--shadow); transition: all 0.2s;
    }
    .msg-bar-input:focus { border-color: var(--accent); width: 360px; }
    .msg-bar-input::placeholder { color: var(--text2); }

    /* ═══ Chat Panel (expanded) ═══ */
    .chat-panel {
      position: fixed; bottom: 90px; right: 20px; z-index: 9998;
      width: 400px; height: 500px; border-radius: var(--radius);
      background: var(--bg); border: 1px solid rgba(255,255,255,0.1);
      box-shadow: var(--shadow); display: none; flex-direction: column;
      overflow: hidden;
    }
    .chat-panel.open { display: flex; }
    .chat-header {
      padding: 12px 16px; background: var(--bg2);
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .chat-header h3 { color: var(--text); font-size: 14px; font-weight: 600; }
    .chat-header-actions { display: flex; gap: 8px; }
    .chat-header-btn {
      background: none; border: none; color: var(--text2); cursor: pointer;
      font-size: 18px; padding: 4px; border-radius: 4px;
    }
    .chat-header-btn:hover { color: var(--text); background: rgba(255,255,255,0.1); }

    /* ═══ Tabs ═══ */
    .chat-tabs {
      display: flex; background: var(--bg2);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .chat-tab {
      flex: 1; padding: 8px; text-align: center; cursor: pointer;
      color: var(--text2); font-size: 12px; font-weight: 500;
      border-bottom: 2px solid transparent; transition: all 0.2s;
    }
    .chat-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .chat-tab:hover { color: var(--text); }

    /* ═══ Messages ═══ */
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px; display: flex;
      flex-direction: column; gap: 8px;
    }
    .msg {
      display: flex; gap: 8px; max-width: 85%;
    }
    .msg.own { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--bg3); display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 600;
      color: var(--text); flex-shrink: 0;
    }
    .msg-avatar.ai { background: #2d1b69; color: #a78bfa; }
    .msg-avatar.system { background: #1b3a2d; color: var(--green); }
    .msg-bubble {
      padding: 8px 12px; border-radius: var(--radius);
      background: var(--bg2); color: var(--text); font-size: 13px;
      line-height: 1.4; word-break: break-word;
    }
    .msg.own .msg-bubble { background: var(--accent); color: #000; }
    .msg-meta { font-size: 10px; color: var(--text2); margin-top: 2px; }
    .msg.own .msg-meta { text-align: right; }
    .msg-sender { font-weight: 600; font-size: 11px; }
    .msg-sender.ai { color: #a78bfa; }
    .msg-sender.system { color: var(--green); }

    /* ═══ Input ═══ */
    .chat-input-area {
      padding: 12px; background: var(--bg2);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 8px;
    }
    .chat-input {
      flex: 1; padding: 10px 14px; border-radius: 20px;
      background: var(--bg); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); font-size: 13px; outline: none; resize: none;
      max-height: 80px;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-send {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; transition: all 0.2s;
    }
    .chat-send:hover { background: var(--accent2); }

    /* ═══ Groups List ═══ */
    .groups-list { flex: 1; overflow-y: auto; padding: 8px; }
    .group-item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.15s;
    }
    .group-item:hover { background: rgba(255,255,255,0.05); }
    .group-item.active { background: rgba(0,212,170,0.15); }
    .group-icon { font-size: 20px; }
    .group-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .group-meta { font-size: 11px; color: var(--text2); }

    /* ═══ Join Group ═══ */
    .join-section { padding: 12px; }
    .join-input {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      background: var(--bg); border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); font-size: 13px; outline: none;
    }
    .join-input:focus { border-color: var(--accent); }
    .join-btn {
      width: 100%; padding: 10px; margin-top: 8px; border-radius: 8px;
      background: var(--accent); border: none; cursor: pointer;
      color: #000; font-size: 13px; font-weight: 600;
    }
    .join-btn:hover { background: var(--accent2); }

    /* ═══ Auth ═══ */
    .auth-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px 20px; text-align: center;
    }
    .auth-screen h2 { color: var(--text); font-size: 18px; margin-bottom: 8px; }
    .auth-screen p { color: var(--text2); font-size: 13px; margin-bottom: 20px; }
    .gh-btn {
      padding: 12px 24px; border-radius: 8px; background: #24292e;
      border: none; cursor: pointer; color: #fff; font-size: 14px;
      font-weight: 500; display: flex; align-items: center; gap: 8px;
    }
    .gh-btn:hover { background: #2f363d; }
    .gh-btn svg { width: 18px; height: 18px; }

    /* ═══ Empty State ═══ */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; color: var(--text2);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
    .empty-state p { font-size: 12px; }

    /* ═══ Toast ═══ */
    .toast {
      position: fixed; top: 20px; right: 20px; z-index: 99999;
      padding: 10px 16px; border-radius: 8px; font-size: 13px;
      color: #fff; animation: slideIn 0.3s;
    }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }
    .toast.info { background: var(--blue); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ═══ Scrollbar ═══ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- ═══ Chat Panel ═══ -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <h3 id="panelTitle">AI Mesh</h3>
      <div class="chat-header-actions">
        <button class="chat-header-btn" onclick="togglePanel()" title="Close">✕</button>
      </div>
    </div>

    <!-- Auth Screen -->
    <div id="authScreen" class="auth-screen">
      <h2>Welcome to AI Mesh</h2>
      <p>Sign in with GitHub to start chatting</p>
      <button class="gh-btn" onclick="githubLogin()">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Continue with GitHub
      </button>
    </div>

    <!-- Dashboard (hidden until auth) -->
    <div id="dashboard" style="display:none; flex:1; display:none; flex-direction:column;">
      <div class="chat-tabs">
        <div class="chat-tab active" onclick="switchTab('messages')">💬 Messages</div>
        <div class="chat-tab" onclick="switchTab('groups')">👥 Groups</div>
        <div class="chat-tab" onclick="switchTab('join')">🔗 Join</div>
      </div>

      <!-- Messages Tab -->
      <div id="tab-messages" class="chat-messages">
        <div class="empty-state">
          <div class="icon">💬</div>
          <h3>Select a group</h3>
          <p>Choose a group from the Groups tab to start chatting</p>
        </div>
      </div>

      <!-- Groups Tab -->
      <div id="tab-groups" class="groups-list" style="display:none;"></div>

      <!-- Join Tab -->
      <div id="tab-join" class="join-section" style="display:none;">
        <h3 style="color:var(--text);font-size:14px;margin-bottom:12px;">Join a Group</h3>
        <input class="join-input" type="text" id="inviteInput" placeholder="Enter invite code...">
        <button class="join-btn" onclick="joinGroup()">Join Group</button>
      </div>

      <!-- Input Area -->
      <div class="chat-input-area" id="inputArea" style="display:none;">
        <textarea class="chat-input" id="msgInput" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)"></textarea>
        <button class="chat-send" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- ═══ Message Bar (floating) ═══ -->
  <div class="msg-bar">
    <input class="msg-bar-input" id="barInput" placeholder="Quick message..." onkeydown="if(event.key==='Enter'){sendQuickMsg();}">
    <button class="msg-bar-btn" onclick="togglePanel()" id="barBtn">💬</button>
  </div>

  <script>
    const API = location.origin;
    let token = localStorage.getItem('mesh_token');
    let username = localStorage.getItem('mesh_username');
    let groups = [];
    let activeGroup = null;
    let activeGroupName = '';
    let ws = null;
    let panelOpen = false;

    // ═══ Panel Toggle ═══
    function togglePanel() {
      const panel = document.getElementById('chatPanel');
      panelOpen = !panelOpen;
      panel.classList.toggle('open', panelOpen);
      if (panelOpen && token) showDashboard();
    }

    // ═══ Tabs ═══
    function switchTab(tab) {
      document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
      event.target.classList.add('active');
      document.getElementById('tab-' + tab).style.display = tab === 'messages' ? 'flex' : 'block';
      if (tab === 'groups') renderGroups();
    }

    // ═══ Auth ═══
    function githubLogin() { location.href = API + '/auth/github'; }

    function logout() {
      fetch(API + '/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
      token = null; username = null;
      localStorage.removeItem('mesh_token');
      localStorage.removeItem('mesh_username');
      location.reload();
    }

    // ═══ Dashboard ═══
    async function showDashboard() {
      try {
        const res = await fetch(API + '/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok) throw new Error('Unauthorized');
        const user = await res.json();
        username = user.username;
        localStorage.setItem('mesh_username', username);
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        document.getElementById('panelTitle').textContent = '@' + username;
        loadGroups();
        connectWS();
        // Auto-join pending invite
        const pending = localStorage.getItem('pending_invite');
        if (pending) { localStorage.removeItem('pending_invite'); document.getElementById('inviteInput').value = pending; joinGroup(); }
      } catch {
        token = null; localStorage.removeItem('mesh_token');
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('dashboard').style.display = 'none';
      }
    }

    // ═══ Groups ═══
    async function loadGroups() {
      const res = await fetch(API + '/groups', { headers: { 'Authorization': 'Bearer ' + token } });
      groups = await res.json();
      renderGroups();
    }

    function renderGroups() {
      const list = document.getElementById('tab-groups');
      if (groups.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><h3>No groups yet</h3><p>Join a group with an invite code</p></div>';
        return;
      }
      list.innerHTML = '';
      groups.forEach(g => {
        const item = document.createElement('div');
        item.className = 'group-item' + (activeGroup === g.id ? ' active' : '');
        item.onclick = () => selectGroup(g.id, g.name);
        item.innerHTML = `
          <div class="group-icon">${g.logo_url ? '<img src="'+esc(g.logo_url)+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover;">' : (g.group_type === 'open' ? '🌐' : g.group_type === 'project' ? '📁' : '👥')}</div>
          <div><div class="group-name">${esc(g.name)}</div><div class="group-meta">${g.member_count} members</div></div>`;
        list.appendChild(item);
      });
    }

    async function selectGroup(id, name) {
      activeGroup = id; activeGroupName = name;
      document.getElementById('panelTitle').textContent = name;
      document.getElementById('inputArea').style.display = 'flex';
      switchTab('messages');
      document.querySelectorAll('.chat-tab')[0].classList.add('active');
      document.querySelectorAll('.chat-tab')[1].classList.remove('active');
      await loadMessages();
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'subscribe_group', group_id: id }));
    }

    async function joinGroup() {
      const code = document.getElementById('inviteInput').value.trim();
      if (!code) return;
      if (!token) { localStorage.setItem('pending_invite', code); githubLogin(); return; }
      const res = await fetch(API + '/groups/join', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ invite_code: code })
      });
      const data = await res.json();
      document.getElementById('inviteInput').value = '';
      if (data.status === 'pending') toast('Join request sent!', 'info');
      else if (data.error) toast(data.message || data.error, 'error');
      else toast('Joined!', 'success');
      loadGroups();
    }

    // ═══ Messages ═══
    async function loadMessages() {
      const container = document.getElementById('tab-messages');
      container.innerHTML = '<div class="empty-state"><div class="spinner"></div>Loading...</div>';
      const res = await fetch(API + '/messages/' + activeGroup, { headers: { 'Authorization': 'Bearer ' + token } });
      const data = await res.json();
      container.innerHTML = '';
      if (!data.messages || data.messages.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">💬</div><h3>No messages yet</h3></div>';
        return;
      }
      data.messages.forEach(msg => appendMessage(msg));
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();
      if (!msg || !activeGroup) return;
      input.value = '';
      await fetch(API + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ group_id: activeGroup, message: msg, type: 'text' })
      });
    }

    async function sendQuickMsg() {
      const input = document.getElementById('barInput');
      const msg = input.value.trim();
      if (!msg) return;
      if (!token) { toast('Sign in first', 'error'); return; }
      if (!activeGroup) { toast('Select a group first', 'error'); togglePanel(); return; }
      input.value = '';
      await fetch(API + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ group_id: activeGroup, message: msg, type: 'text' })
      });
    }

    function appendMessage(msg) {
      const container = document.getElementById('tab-messages');
      const empty = container.querySelector('.empty-state');
      if (empty) empty.remove();
      const isOwn = msg.sender_username === username;
      const isAI = !!msg.sender_ai;
      const isSystem = msg.sender_username === 'system' || msg.sender_username === 'Approval System';
      const div = document.createElement('div');
      div.className = 'msg' + (isOwn ? ' own' : '');
      const initial = (msg.sender_username || '?')[0].toUpperCase();
      const avatarClass = isSystem ? 'system' : isAI ? 'ai' : '';
      const senderClass = isSystem ? 'system' : isAI ? 'ai' : '';
      const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const content = esc(msg.content).replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent);">$1</a>');
      div.innerHTML = `
        <div class="msg-avatar ${avatarClass}">${initial}</div>
        <div>
          <div class="msg-sender ${senderClass}">${esc(msg.sender_username)}${isAI ? ' · '+esc(msg.sender_ai) : ''}</div>
          <div class="msg-bubble">${content}</div>
          <div class="msg-meta">${time}</div>
        </div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    // ═══ WebSocket ═══
    function connectWS() {
      if (ws) return;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws');
      ws.onopen = () => { if (token) ws.send(JSON.stringify({ type: 'auth', token })); };
      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'message' && msg.payload?.group_id === activeGroup) appendMessage(msg.payload);
        } catch {}
      };
      ws.onclose = () => { ws = null; setTimeout(connectWS, 3000); };
    }

    // ═══ Toast ═══
    function toast(text, type = 'info') {
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = text;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ═══ Init ═══
    const hashParams = new URLSearchParams(location.hash.slice(1));
    const cbToken = hashParams.get('token');
    const cbUser = hashParams.get('username');
    if (cbToken) {
      token = cbToken;
      localStorage.setItem('mesh_token', token);
      if (cbUser) { username = decodeURIComponent(cbUser); localStorage.setItem('mesh_username', username); }
      history.replaceState({}, '', '/');
    }
    if (token) showDashboard();
  </script>
</body>
</html>
